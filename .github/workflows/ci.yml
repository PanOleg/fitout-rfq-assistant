name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # pdftotext / pdftoppm (poppler) and tesseract, so the PDF layout and OCR tests run instead of skipping.
      - name: Install PDF and OCR tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: Style, static analysis, boundaries, tests
        run: composer check
