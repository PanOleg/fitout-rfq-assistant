name: evals

# Live extraction evals against the Claude API. Manual only: every run costs money.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models, space-separated (e.g. "claude-opus-5 claude-sonnet-5")'
        default: 'claude-opus-5'
      efforts:
        description: 'Efforts, space-separated (low | medium | high | xhigh | max)'
        default: 'medium'
      case:
        description: 'Only cases whose name contains this (empty = all)'
        default: ''

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          EFFORTS: ${{ inputs.efforts }}
          CASE: ${{ inputs.case }}
        run: |
          args=()
          for m in $MODELS; do args+=("--model=$m"); done
          for e in $EFFORTS; do args+=("--effort=$e"); done
          [ -n "$CASE" ] && args+=("--case=$CASE")
          php artisan rfq:eval "${args[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            storage/evals/*.json
            evals/results/*.md
